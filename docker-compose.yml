version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: nexsolve_db
    environment:
      POSTGRES_USER: nexsolve
      POSTGRES_PASSWORD: nexsolve_password
      POSTGRES_DB: nexsolve
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexsolve"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexsolve_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://nexsolve:nexsolve_password@db:5432/nexsolve
      JWT_SECRET_KEY: supersecretjwtkey_change_in_production
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 60
      SMTP_HOST: ""
      SMTP_PORT: 587
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: noreply@nexsolve.local
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  uploads_data:
